<script>const DOMAINS = [{"id": 1, "code": "1.0", "title": "General Security Concepts", "weight": "12%", "color": "#3b82f6"}, {"id": 2, "code": "2.0", "title": "Threats, Vulnerabilities & Mitigations", "weight": "22%", "color": "#ef4444"}, {"id": 3, "code": "3.0", "title": "Security Architecture", "weight": "18%", "color": "#8b5cf6"}, {"id": 4, "code": "4.0", "title": "Security Operations", "weight": "28%", "color": "#10b981"}, {"id": 5, "code": "5.0", "title": "Security Program Management & Oversight", "weight": "20%", "color": "#f59e0b"}];
const CHAPTERS = [{"id": "1.1", "domain": 1, "title": "Security Controls", "estMinutes": 6, "body": "## Why security controls matter\nSecurity risks come in many forms \u2014 malware, phishing, insider abuse, environmental hazards. **Controls** are the safeguards that prevent events, minimize damage, and keep systems running.\n\n## The 4 control categories (WHO/WHAT enforces it)\n* **Technical** \u2014 implemented by systems. Firewalls, antivirus, encryption, OS access lists.\n* **Managerial** \u2014 administrative direction. Risk assessments, security policies, SOPs.\n* **Operational** \u2014 performed by people. Awareness training, guards, change-review meetings.\n* **Physical** \u2014 limit physical access. Fences, locks, badges, mantraps, lighting, guard shacks.\n\n## The 6 control types (WHAT the control DOES)\n* **Preventive** \u2014 blocks the action. Firewall rule, door lock, \"no entry\" policy.\n* **Deterrent** \u2014 discour\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "1.2a", "domain": 1, "title": "CIA Triad & Non-repudiation", "estMinutes": 5, "body": "## The CIA Triad \u2014 the foundation of infosec\n* **Confidentiality** \u2014 only authorized parties see the data. Achieved via encryption, access control, steganography.\n* **Integrity** \u2014 data hasn't been altered (or alteration is detectable). Achieved via hashing, digital signatures, certificates.\n* **Availability** \u2014 the system/data is reachable when needed. Achieved via redundancy, fault tolerance, patching, capacity planning.\n\nSometimes called the **AIC triad** to avoid confusion with the U.S. Central Intelligence Agency.\n\n## Non-repudiation\n\"You can't deny you did it.\" Two pieces work together:\n* **Proof of integrity** \u2014 a hash shows the message wasn't changed.\n* **Proof of origin** \u2014 a digital signature (signed with the **sender's private key**) proves *who* sent it.\n\nA handwritten signatur\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "1.2b", "domain": 1, "title": "AAA \u2014 Authentication, Authorization & Accounting", "estMinutes": 5, "body": "## The three A's\n* **Authentication** \u2014 proving you are who you say you are.\n* **Authorization** \u2014 what you're allowed to do once authenticated.\n* **Accounting (Auditing)** \u2014 recording what you did.\n\n## Authentication factors\n* **Something you know** \u2014 password, PIN.\n* **Something you have** \u2014 smart card, hardware token, phone (push notification, TOTP).\n* **Something you are** \u2014 biometric: fingerprint, face, iris, retina, voice.\n* **Somewhere you are** \u2014 geolocation / GPS / IP geofencing.\n* **Something you do** \u2014 behavioral biometrics (typing rhythm, gait).\n\n**Multifactor authentication (MFA)** combines factors from *different categories* \u2014 two passwords is NOT MFA.\n\n## AAA for systems vs. people\n* **Users** authenticate with passwords/MFA.\n* **Devices** authenticate with **certificates** \n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "1.2c", "domain": 1, "title": "Zero Trust", "estMinutes": 6, "body": "## The big idea\nOld model: trust everything inside the perimeter, distrust everything outside. Zero Trust says **trust nothing, verify everything**, every time.\n\n> \"Never trust, always verify.\"\n\n## Two planes\n* **Control plane** \u2014 defines the policy. Who is allowed to do what, under what conditions.\n* **Data plane** \u2014 enforces the policy. Where the actual user/data traffic flows.\n\n## Control plane components\n* **Adaptive identity** \u2014 risk-based: more checks if you sign in from a new country at 3am.\n* **Threat scope reduction** \u2014 limit what each session can touch.\n* **Policy-driven access control** \u2014 decisions based on identity, device posture, location, time.\n* **Policy administrator / Policy engine** \u2014 make and push the decisions.\n\n## Data plane components\n* **Subject / system** \u2014 who is \n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "1.2d", "domain": 1, "title": "Physical Security & Deception", "estMinutes": 6, "body": "## Physical access controls\n* **Bollards** \u2014 short posts that stop vehicles from ramming a building.\n* **Access control vestibule (mantrap)** \u2014 two interlocked doors; only one opens at a time. Stops tailgating.\n* **Fencing** \u2014 perimeter; height + razor wire raise effort.\n* **Video surveillance / CCTV** \u2014 detective; modern systems do motion + facial recognition.\n* **Security guards** \u2014 flexible response; can verify identity and judge intent.\n* **Access badge** \u2014 proximity card, smart card. Often paired with PIN (something-you-have + something-you-know).\n* **Lighting** \u2014 deterrent + enables cameras.\n* **Sensors** \u2014 infrared, pressure, microwave, ultrasonic \u2014 detect intrusion.\n\n## Deception & disruption\nThe defender's psy-ops:\n* **Honeypot** \u2014 a single fake system that looks juicy. Watches wh\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "1.2e", "domain": 1, "title": "Gap Analysis", "estMinutes": 3, "body": "## What it is\nA **gap analysis** compares your **current** security posture to a **desired** one (often defined by a framework like **NIST CSF**, **ISO 27001**, or a regulation like PCI DSS).\n\n## Steps\n1. **Define the target state** \u2014 pick the standard or business requirement.\n2. **Inventory current controls** \u2014 what's actually in place?\n3. **Compare** \u2014 find gaps (controls missing, partial, or weak).\n4. **Plan remediation** \u2014 prioritize by risk and cost.\n5. **Track** \u2014 close gaps and reassess on a schedule.\n\n## Why it matters\nYou can't defend what you can't measure. Gap analysis turns a vague \"we should improve security\" into a **prioritized roadmap with owners and dates**. Often a starting point for **POA&Ms** (Plans of Action and Milestones)."}, {"id": "1.3", "domain": 1, "title": "Change Management", "estMinutes": 6, "body": "## Why change management is a security topic\nMost outages and many breaches come from **bad changes**, not attackers. Formal change management catches risk before it ships.\n\n## Process pieces\n* **Change request** \u2014 proposes the change with business justification.\n* **Approval process** \u2014 who signs off. Tiered by risk (standard / normal / emergency).\n* **Owners** \u2014 responsible party for the change AND for the affected system.\n* **Stakeholders** \u2014 anyone impacted (business, ops, security).\n* **Impact analysis** \u2014 what could go wrong; what depends on this system.\n* **Test results** \u2014 proof it works in a non-prod environment.\n* **Backout plan** \u2014 how to revert quickly if it fails.\n* **Maintenance window** \u2014 agreed downtime period.\n* **SOP (Standard Operating Procedure)** \u2014 repeatable steps.\n\n#\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "1.4a", "domain": 1, "title": "PKI & Encrypting Data", "estMinutes": 7, "body": "## Public Key Infrastructure (PKI)\nA framework of policies, hardware, software, and procedures to **create, manage, distribute, store, and revoke** digital certificates.\n\n* **Certificate Authority (CA)** \u2014 issues and signs certs. Trust is rooted in the CA.\n* **Registration Authority (RA)** \u2014 verifies identity before the CA issues a cert.\n* **Public/private key pair** \u2014 mathematically linked. Public is freely shared; private is *never* shared.\n\n## Key types\n* **Symmetric encryption** \u2014 same key encrypts and decrypts. **Fast**. Used for bulk data. Examples: **AES** (standard, 128/192/256 bit), 3DES (deprecated).\n* **Asymmetric encryption** \u2014 public key encrypts, private key decrypts (or vice-versa for signing). **Slow**. Used for key exchange, signatures. Examples: **RSA**, **ECC** (smaller \n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "1.4b", "domain": 1, "title": "Hashing & Digital Signatures", "estMinutes": 5, "body": "## Hashing \u2014 fingerprint of data\nA **hash** is a one-way function that produces a fixed-length output (\"digest\") from any input.\n\n* **One-way** \u2014 you cannot derive the input from the hash.\n* **Deterministic** \u2014 same input \u2192 same hash, always.\n* **Avalanche effect** \u2014 tiny input change \u2192 completely different hash.\n* **Collision-resistant** \u2014 finding two inputs with the same hash should be infeasible.\n\n## Hash algorithms\n* **MD5** \u2014 128-bit, **broken** (collisions known). Don't use for security.\n* **SHA-1** \u2014 160-bit, **deprecated**. Collisions demonstrated.\n* **SHA-2** \u2014 current standard. Common variants: **SHA-256**, **SHA-512**.\n* **SHA-3** \u2014 newer, different internal design (Keccak).\n\n## Salting\nA **salt** is random data added to a password before hashing. Defeats **rainbow tables** beca\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "1.4c", "domain": 1, "title": "Certificates & Trust", "estMinutes": 6, "body": "## What's in a digital certificate (X.509)\n* **Public key** of the subject.\n* **Subject** \u2014 who the cert identifies (a CN like `example.com`).\n* **Issuer** \u2014 the CA that signed it.\n* **Validity dates** \u2014 not before / not after.\n* **Serial number, signature, extensions** (e.g., **Subject Alternative Names \u2014 SAN**).\n* The CA's **digital signature** binds it all together.\n\n## Trust model\n* **Root CA** \u2014 self-signed, top of the chain. Pre-installed in OS/browser trust stores.\n* **Intermediate CA** \u2014 signed by root, signs end-entity certs. Limits damage if compromised.\n* **End-entity / leaf** \u2014 the cert your website uses.\n\nA browser validates the **chain of trust** all the way up to a root it trusts.\n\n## Certificate types\n* **Domain Validation (DV)** \u2014 proves you control the domain. Cheap/free \n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "1.4d", "domain": 1, "title": "Obfuscation, Steganography & Blockchain", "estMinutes": 5, "body": "## Obfuscation \u2014 hide in plain sight\nMake data hard to understand without \"encrypting\" it in the cryptographic sense.\n* **Steganography** \u2014 hide a message inside another file (image, audio, video). The carrier looks normal.\n* **Tokenization** \u2014 replace sensitive values with non-sensitive tokens. The mapping lives in a vault. Heavily used for **PCI** (credit card data).\n* **Data masking** \u2014 show partial data (`****-****-****-1234`) to users who don't need the full value.\n\nTokenization vs. encryption: encryption is **reversible with a key**; tokenization just looks up the original from a vault. A stolen token by itself is useless.\n\n## Key Stretching\nSlow down brute force by repeatedly hashing the password (PBKDF2, bcrypt, scrypt). Adds cost per attempt.\n\n## Blockchain\nA **distributed, append\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "2.1", "domain": 2, "title": "Threat Actors & Motivations", "estMinutes": 6, "body": "## Actor categories\n* **Nation-state / APT** \u2014 well funded, patient, highly skilled. Goals: espionage, infrastructure disruption, election interference. Threat is **external**.\n* **Organized crime** \u2014 money. Ransomware, banking trojans, BEC. External, financially motivated.\n* **Hacktivist** \u2014 ideology. Defacement, DDoS, doxing. External; can be very public.\n* **Insider threat** \u2014 employees/contractors. Could be malicious (revenge, espionage) or accidental (clicking phish). **Internal**, often hardest to detect.\n* **Script kiddie** \u2014 low skill, uses pre-built tools. Often opportunistic.\n* **Shadow IT** \u2014 internal users/teams running unsanctioned tech (a personal Dropbox, a side AWS account). Not malicious but creates unmanaged risk.\n\n## Attributes to compare\n* **Internal vs external**\n* **R\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "2.2a", "domain": 2, "title": "Threat Vectors & Attack Surfaces", "estMinutes": 6, "body": "## Common message-based vectors\n* **Email** \u2014 phishing, malware attachments, malicious links.\n* **SMS (smishing)** \u2014 link to fake login.\n* **Voice (vishing)** \u2014 phone call pretending to be IT/bank/IRS.\n* **Instant messaging** \u2014 Slack/Teams/WhatsApp messages with malicious links.\n\n## Image / file vectors\n* Malicious links in embedded images, malicious **macros** in Office docs, malicious PDFs, **ISO/IMG files** to bypass mark-of-the-web.\n\n## Removable media\nUSB drops in parking lots \u2014 old but still works. Malicious **HID** (rubber ducky) sticks pretend to be keyboards.\n\n## Network vectors\n* **Wireless** \u2014 rogue AP, evil twin, deauth attacks.\n* **Wired** \u2014 unauthorized device on a port (defended with **802.1X**).\n* **Bluetooth** \u2014 bluejacking/bluesnarfing.\n* **Open service ports** \u2014 anything\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "2.2b", "domain": 2, "title": "Phishing & Social Engineering Tactics", "estMinutes": 6, "body": "## Phishing variants\n* **Phishing** \u2014 broad email net, generic lures.\n* **Spear phishing** \u2014 targeted; uses real names, projects, vendor info.\n* **Whaling** \u2014 targets a \"big fish\" (CEO, CFO).\n* **Smishing** \u2014 SMS-based.\n* **Vishing** \u2014 phone-based.\n* **Watering hole** \u2014 compromise a site the target group routinely visits, infect them when they visit.\n* **Pharming** \u2014 redirect users to a fake site at the DNS level.\n* **Angler phishing** \u2014 fake customer-service accounts on social media that intercept complaints.\n\n## What makes phishing work \u2014 the \"principles of social engineering\"\n* **Authority** \u2014 \"I'm from IT/HR/the CEO.\"\n* **Intimidation** \u2014 \"If you don't act, your account is locked.\"\n* **Consensus / social proof** \u2014 \"Everyone else has done this already.\"\n* **Scarcity** \u2014 \"Limited spots \u2014\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "2.3a", "domain": 2, "title": "Application & OS Vulnerabilities", "estMinutes": 8, "body": "## Memory-based attacks\n* **Buffer overflow** \u2014 write past the end of a buffer; can overwrite the return address and execute attacker code. Defenses: **NX/DEP** (no-execute memory), **ASLR** (randomize addresses), **stack canaries**, safe languages.\n* **Memory injection** \u2014 inject code/data into a running process (DLL injection, process hollowing).\n* **Race conditions** \u2014 two operations happen in the wrong order. Classic case: **TOCTOU** (Time-Of-Check / Time-Of-Use) \u2014 check a file's permissions, then use it; attacker swaps the file in between.\n\n## Web application\n* **SQL injection** \u2014 user input becomes part of a SQL query. Defense: **parameterized queries / prepared statements**, input validation, least-privilege DB accounts.\n* **XSS (Cross-Site Scripting)** \u2014 attacker injects JavaScript\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "2.3b", "domain": 2, "title": "Hardware, Cloud, Virtualization & Supply-Chain Vulns", "estMinutes": 7, "body": "## Hardware\n* **Firmware** \u2014 runs before/under the OS. Compromised firmware survives reinstalls. **Secure Boot** + signed firmware help.\n* **End-of-life (EoL)** \u2014 vendor stops issuing patches. Devices must be replaced or isolated.\n* **Legacy systems** \u2014 still in use, not supported. Compensating controls (segmentation, allowlisting, monitoring).\n\n## Virtualization\n* **VM escape** \u2014 break out of a guest VM into the hypervisor or other guests. Rare but catastrophic.\n* **Resource reuse** \u2014 one tenant's freed memory/disk leaks to another. Solved by zeroing on release; cloud platforms do this.\n* **Hypervisor vulns** \u2014 patch them like any other software.\n\n## Cloud-specific\n* **Misconfiguration** \u2014 far and away the #1 cloud breach cause. Public S3 buckets, open security groups, weak IAM policies.\n\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "2.4a", "domain": 2, "title": "Malware Types", "estMinutes": 7, "body": "## Self-replicating\n* **Virus** \u2014 needs a host file and user action to spread. Types: boot sector, macro, polymorphic (changes its code), metamorphic.\n* **Worm** \u2014 self-propagates over the network with no user interaction. Famous: Conficker, WannaCry.\n\n## Hidden control\n* **Trojan** \u2014 pretends to be legitimate software; user installs it.\n* **RAT (Remote Access Trojan)** \u2014 gives the attacker persistent remote control.\n* **Rootkit** \u2014 operates at the kernel/firmware level; very stealthy. Detection often requires booting from clean media.\n* **Bootkit** \u2014 infects the boot loader so it loads before the OS.\n* **Backdoor** \u2014 built-in or installed access mechanism that bypasses normal auth.\n\n## Profit-driven\n* **Ransomware** \u2014 encrypts files and demands payment. Modern variants do **double extorti\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "2.4b", "domain": 2, "title": "Network Attacks", "estMinutes": 7, "body": "## Denial of Service\n* **DoS** \u2014 single source overwhelms a target.\n* **DDoS** \u2014 distributed; thousands of bots amplify the attack.\n* **Volumetric / amplification** \u2014 DNS or NTP reflection: small request, huge response sent at the victim.\n* **Application-layer DDoS (Layer 7)** \u2014 slow, low-volume requests that exhaust application resources (Slowloris).\n\nDefenses: upstream scrubbing services (Cloudflare, AWS Shield), rate limiting, anycast, capacity headroom.\n\n## DNS attacks\n* **DNS poisoning / spoofing** \u2014 corrupt cache so users get wrong IP.\n* **Domain hijacking** \u2014 attacker takes over the DNS account / registrar.\n* **DNS tunneling** \u2014 exfiltrate data inside DNS queries.\n* **URL hijacking / typosquatting** \u2014 register lookalike domains.\n\nDefense: **DNSSEC** (signs DNS responses), restricted\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "2.4c", "domain": 2, "title": "Password & Application Attacks", "estMinutes": 6, "body": "## Password attacks\n* **Brute force** \u2014 try every combination. Defeated by **lockouts** + **long passwords** + **slow hashes**.\n* **Dictionary attack** \u2014 try a list of common passwords/phrases.\n* **Hybrid** \u2014 dictionary words + common substitutions (P@ssw0rd!).\n* **Spraying** \u2014 try a few common passwords against MANY accounts (avoids per-account lockout).\n* **Credential stuffing** \u2014 reuse breached username/password pairs from another site. Defense: unique passwords per site, MFA, breach detection.\n* **Rainbow table** \u2014 precomputed hashes. Defeated by **salting**.\n* **Pass-the-hash** \u2014 use the hash itself to authenticate without knowing the password (Windows NTLM).\n\n## Application attacks\n* **Buffer overflow** \u2014 covered earlier.\n* **Race conditions / TOCTOU** \u2014 covered.\n* **Injection** \u2014 SQ\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "2.4d", "domain": 2, "title": "Indicators of Compromise (IoCs)", "estMinutes": 6, "body": "## What's an IoC?\nA clue that a system is or was compromised. Investigators use IoCs to find related infections and to share threat intel.\n\n## Common IoCs\n* **Account lockouts** \u2014 automated brute force.\n* **Concurrent session usage** \u2014 same account logged in from two countries.\n* **Blocked content** \u2014 repeated blocks from the same source = scanning/probing.\n* **Impossible travel** \u2014 login from NYC, then 5 minutes later from Berlin.\n* **Resource consumption** \u2014 CPU/disk/network spikes (cryptominer, exfil).\n* **Resource inaccessibility** \u2014 files encrypted or quarantined.\n* **Out-of-cycle logging** \u2014 logs at 3am from a service that runs 9\u20135.\n* **Published IoCs** \u2014 hashes, IP addresses, domains shared by vendors/ISACs.\n* **Missing logs** \u2014 attacker cleared them. The *absence* is the indicator.\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "2.5", "domain": 2, "title": "Mitigation & Hardening Techniques", "estMinutes": 6, "body": "## Mitigation techniques\n* **Segmentation** \u2014 divide the network into zones; a breach in one doesn't reach the others. Often via **VLANs** or **subnets** + firewall rules.\n* **Microsegmentation** \u2014 segment down to individual workloads (host firewalls, service mesh).\n* **Access control** \u2014 ACLs, permissions, least privilege.\n* **Application allow lists** \u2014 only approved apps can run (positive security model). Strong but operationally heavy.\n* **Application deny / block lists** \u2014 known-bad apps blocked.\n* **Isolation / quarantine** \u2014 pull a compromised host off the network.\n* **Patching** \u2014 close known vulns. Tier by severity and exposure.\n* **Encryption** \u2014 both at rest and in transit.\n* **Monitoring** \u2014 you can't respond to what you don't see.\n* **Least privilege** \u2014 give every user/proces\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "3.1a", "domain": 3, "title": "Cloud & Architecture Models", "estMinutes": 8, "body": "## Cloud service models\n* **IaaS** \u2014 Infrastructure (VMs, storage, networking). You manage OS+up. Example: EC2.\n* **PaaS** \u2014 Platform (managed runtime/DB). You manage code. Example: App Service, RDS.\n* **SaaS** \u2014 Software. You manage configuration & data. Example: Microsoft 365, Salesforce.\n\n## Cloud deployment models\n* **Public** \u2014 multi-tenant, shared infrastructure (AWS, Azure, GCP).\n* **Private** \u2014 dedicated to one organization (on-prem cloud or single-tenant hosted).\n* **Community** \u2014 shared by orgs with similar concerns (gov agencies).\n* **Hybrid** \u2014 mix of public + private with orchestration.\n* **Multi-cloud** \u2014 using more than one public provider.\n\n## Shared responsibility model\nProvider always handles the **physical layer** + **hypervisor** (for IaaS).\n* **IaaS** \u2014 customer handle\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "3.1b", "domain": 3, "title": "Network Infrastructure & Considerations", "estMinutes": 7, "body": "## Network concepts\n* **Software-defined networking (SDN)** \u2014 separates the **control plane** (decisions) from the **data plane** (forwarding). Centralized policy, programmable.\n* **VPC / VNet** \u2014 your private cloud network.\n* **Public vs. private subnets** \u2014 whether instances have direct internet access.\n* **NAT, gateway, transit gateway** \u2014 routing options between subnets.\n\n## Infrastructure considerations\nWhen choosing or designing infrastructure, weigh:\n* **Availability** \u2014 uptime targets (e.g., 99.9% = ~8.7h downtime/yr).\n* **Resilience** \u2014 survives failures (HA pairs, multi-region, auto-scaling).\n* **Cost** \u2014 capex vs. opex; reserved vs. on-demand.\n* **Responsiveness** \u2014 latency to users.\n* **Scalability** \u2014 handles spikes (vertical = bigger box, horizontal = more boxes).\n* **Ease of\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "3.2a", "domain": 3, "title": "Secure Network Appliances", "estMinutes": 6, "body": "## Firewalls\n* **Packet-filtering** \u2014 stateless. Looks at IP/port. Fast, blunt.\n* **Stateful** \u2014 tracks connection state. Most LAN firewalls.\n* **Next-Generation Firewall (NGFW)** \u2014 stateful + application awareness + IDS/IPS + decryption + identity. Layer 7.\n* **Web Application Firewall (WAF)** \u2014 protects HTTP apps from OWASP-style attacks.\n* **Unified Threat Management (UTM)** \u2014 multi-function appliance for SMBs (firewall, AV, IDS, content filter).\n\n## Intrusion Detection / Prevention\n* **IDS** \u2014 passive: detects, alerts. Out-of-band.\n* **IPS** \u2014 inline: detects and **blocks**. In-line so it can drop packets.\nMethods:\n* **Signature-based** \u2014 known patterns. Misses unknowns.\n* **Anomaly-based** \u2014 deviation from a learned baseline. Catches new attacks; more false positives.\n* **Behavior-bas\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "3.2b", "domain": 3, "title": "Secure Communications & Ports", "estMinutes": 6, "body": "## Secure protocols (memorize the pairs)\n| Insecure | Secure | Port |\n|---|---|---|\n| HTTP (80) | **HTTPS** | 443 |\n| FTP (21) | **FTPS** / **SFTP** | 990 / 22 |\n| Telnet (23) | **SSH** | 22 |\n| SMTP (25) | **SMTPS / SMTP+STARTTLS** | 465 / 587 |\n| POP3 (110) | **POP3S** | 995 |\n| IMAP (143) | **IMAPS** | 993 |\n| LDAP (389) | **LDAPS** | 636 |\n| SNMP v1/v2c | **SNMPv3** | 161/162 |\n| DNS (53) | **DNS over TLS / HTTPS** | 853 / 443 |\n\n## VPN options\n* **Remote-access VPN** \u2014 user \u2192 corporate network. Protocols: **SSL/TLS VPN (HTTPS)**, **IPsec**.\n* **Site-to-site VPN** \u2014 two networks linked over the internet via IPsec.\n* **Always-on VPN** \u2014 auto-connects whenever the device is online.\n* **Split tunnel** \u2014 only corp traffic goes over VPN. Faster, less secure.\n* **Full tunnel** \u2014 all traffic \n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "3.3", "domain": 3, "title": "Data Classification & Protection", "estMinutes": 6, "body": "## Data types & sensitivity\n* **Regulated** \u2014 governed by law (HIPAA PHI, GDPR personal data, PCI cardholder data).\n* **Trade secret / IP** \u2014 proprietary value to the business.\n* **Legal** \u2014 privileged communications.\n* **Financial** \u2014 accounting, payroll.\n* **Human-readable / non-human-readable** \u2014 text vs. machine-only formats.\n\n## Classification levels (typical commercial)\n* **Public** \u2014 anyone can see.\n* **Internal / Private** \u2014 for employees only.\n* **Confidential** \u2014 restricted to specific groups.\n* **Restricted / Critical** \u2014 highest sensitivity; tightly controlled.\n\nGovernment uses **Unclassified, Confidential, Secret, Top Secret**.\n\n## States of data\n* **Data at rest** \u2014 stored on disk/SSD/tape. Protect with **FDE / volume encryption / TDE**.\n* **Data in transit (motion)** \u2014 over \n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "3.4", "domain": 3, "title": "Resilience, Backups & Recovery", "estMinutes": 7, "body": "## High availability vs. disaster recovery\n* **HA** \u2014 keeps things running through small failures (server crash, AZ failure). Measured in nines.\n* **DR** \u2014 restores after a major event (region down, ransomware, disaster). Measured in **RTO / RPO**.\n\n## Key metrics\n* **RTO (Recovery Time Objective)** \u2014 how long the business can tolerate being down.\n* **RPO (Recovery Point Objective)** \u2014 how much data loss is acceptable (drives backup frequency).\n* **MTTR (Mean Time To Repair)** \u2014 average time to recover.\n* **MTBF (Mean Time Between Failures)** \u2014 reliability indicator.\n\n## Site types\n* **Hot site** \u2014 fully equipped, running, near-real-time data sync. Fast RTO, expensive.\n* **Warm site** \u2014 equipped but not always running; needs data restored.\n* **Cold site** \u2014 empty space with power and conne\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "4.1", "domain": 4, "title": "Hardening, Wireless & Mobile Security", "estMinutes": 7, "body": "## Secure baselines\nA **baseline** is the documented, approved configuration of a system. Process:\n1. **Establish** \u2014 define what \"secure\" looks like (CIS Benchmarks are common starting points).\n2. **Deploy** \u2014 image / push the baseline.\n3. **Maintain** \u2014 drift detection, re-apply, update baseline as software changes.\n\n## Hardening targets\nApply the same idea everywhere \u2014 workstations, servers, mobile, network gear, cloud, IoT, ICS, RTOS. Disable unused services, change default credentials, restrict admin, encrypt, log.\n\n## Mobile deployment models\n* **BYOD (Bring Your Own Device)** \u2014 user-owned. Privacy concerns; need MDM with containerization.\n* **CYOD (Choose Your Own Device)** \u2014 user picks from approved list, company-owned.\n* **COPE (Company Owned, Personally Enabled)** \u2014 fully managed\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "4.2", "domain": 4, "title": "Asset Management", "estMinutes": 4, "body": "## You can't protect what you don't know about\nAsset management is foundational. Most breach reports include \"we didn't know that asset existed.\"\n\n## Acquisition / procurement\n* Purchase through approved channels (avoids counterfeit, ensures support).\n* Vet vendors.\n* Receive, log, image, baseline.\n\n## Inventory\n* **Asset list / CMDB** \u2014 what we own, where, who uses it, what it does.\n* **Tagging** \u2014 physical labels + asset IDs in software.\n* **Ownership** \u2014 every asset has an owner accountable for it.\n* **Classification** \u2014 tied to data sensitivity hosted on the asset.\n\n## Assignment / accountability\n* Track who has the device.\n* Acceptable use signed.\n\n## Monitoring\n* Patch status.\n* Configuration drift.\n* Location (especially for mobile).\n\n## Disposal / decommissioning\n* **Sanitization**\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "4.3", "domain": 4, "title": "Vulnerability Management", "estMinutes": 8, "body": "## Identification methods\n* **Vulnerability scanning** \u2014 automated tools (Nessus, Qualys, OpenVAS) check for known vulns.\n* **Penetration testing** \u2014 humans actively exploit to prove impact.\n* **Bug bounty** \u2014 pay external researchers for valid findings.\n* **Application security testing** \u2014 SAST (source code), DAST (running app), IAST (instrumented), SCA (3rd-party libs).\n* **Threat intelligence feeds** \u2014 vendor advisories, ISAC alerts.\n* **Dark web monitoring** \u2014 leaked credentials.\n\n## Static vs. Dynamic vs. Package\n* **SAST** \u2014 analyze source code without running it. Catches injection, hardcoded secrets, insecure APIs early.\n* **DAST** \u2014 test running app from outside. Catches runtime issues, auth flaws.\n* **Package monitoring / SCA** \u2014 check 3rd-party libs against CVE databases (Snyk, D\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "4.4", "domain": 4, "title": "Security Monitoring & Tools", "estMinutes": 6, "body": "## What gets monitored\n* **Computing resources** \u2014 endpoints (EDR), servers, containers.\n* **Applications** \u2014 logs, transactions, abnormal flows.\n* **Infrastructure** \u2014 network devices, cloud services.\n\n## Activities\n* **Log aggregation** \u2014 ship logs to a central place.\n* **Alerting** \u2014 rules / detections fire on suspicious patterns.\n* **Reporting** \u2014 periodic summaries to leadership.\n* **Archiving** \u2014 long-term storage for compliance / forensics.\n* **Alert response and remediation / validation** \u2014 close the loop.\n\n## Tools\n* **SIEM (Security Information and Event Management)** \u2014 aggregates logs from many sources, correlates, alerts. Splunk, Sentinel, QRadar, Elastic SIEM.\n* **SOAR (Security Orchestration, Automation, and Response)** \u2014 automates responses with playbooks (auto-isolate host,\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "4.5", "domain": 4, "title": "Enterprise Security Capabilities", "estMinutes": 7, "body": "## Firewalls (revisited at the enterprise scale)\n* **NGFW** \u2014 primary perimeter & east-west.\n* **WAF** \u2014 protects HTTP apps.\n* **Cloud firewalls / security groups** \u2014 per-instance.\n* **Host-based firewalls** \u2014 on each endpoint.\n\n## IDS / IPS\n* **NIDS / NIPS** \u2014 network-based.\n* **HIDS / HIPS** \u2014 host-based.\n\n## Web filtering\n* **Forward proxy** \u2014 every outbound request goes through it.\n* **URL scanning** \u2014 block known-bad sites.\n* **Content categorization** \u2014 block by category (gambling, malware, social).\n* **Block rules / DNS filtering** \u2014 Cisco Umbrella, NextDNS.\n* **Reputation services** \u2014 block based on IP/domain reputation.\n* **Agent-based vs. centralized proxy** \u2014 agent works off-network too.\n\n## Operating system security\n* **Group Policy (Windows)** \u2014 central config & lockdown.\n* **\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "4.6a", "domain": 4, "title": "Identity & Access Management", "estMinutes": 8, "body": "## Lifecycle (Joiner / Mover / Leaver)\n* **Provisioning** \u2014 create accounts when employees join.\n* **Mover** \u2014 adjust access on role change. **Privilege creep** happens when old access isn't removed.\n* **Deprovisioning** \u2014 disable on departure (don't delete immediately \u2014 preserve audit trail).\n* **Permission assignment / implications** \u2014 who can do what; documented.\n\n## Identity proofing\nVerify the person is who they claim *before* issuing credentials.\n\n## Federation & SSO\n* **SSO (Single Sign-On)** \u2014 log in once, access many apps.\n* **Federation** \u2014 trust between separate orgs/identity domains.\n* **SAML** \u2014 XML-based, common for SaaS SSO. Roles: Identity Provider (IdP), Service Provider (SP), Principal (user).\n* **OAuth 2.0** \u2014 authorization (delegated access), not authentication.\n* **Ope\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "4.7", "domain": 4, "title": "Automation & Orchestration", "estMinutes": 5, "body": "## Why automate\n* Speed \u2014 minutes vs. hours.\n* Consistency \u2014 no copy-paste typos.\n* Scale \u2014 manage thousands of devices.\n* Reduces human error.\n* Frees skilled people for higher-value work.\n\n## Use cases\n* **User provisioning / deprovisioning** \u2014 auto-create on hire, disable on departure.\n* **Resource provisioning** \u2014 IaC (Terraform).\n* **Guard rails** \u2014 config policies (Azure Policy, AWS Config, OPA).\n* **Security groups** \u2014 automate group membership based on attributes.\n* **Ticket creation / escalation** \u2014 alerts auto-create incidents.\n* **Service enabling / disabling** \u2014 turn off a risky service company-wide on detection.\n* **Continuous integration / deployment** \u2014 automated tests + deploys with security gates.\n* **API integrations** \u2014 connect SIEM \u2192 SOAR \u2192 ticket \u2192 comms.\n\n## Considera\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "4.8", "domain": 4, "title": "Incident Response", "estMinutes": 8, "body": "## NIST SP 800-61 IR lifecycle\n1. **Preparation** \u2014 IR plan, tools, training, comms templates, contact tree.\n2. **Detection & Analysis (Identification)** \u2014 confirm the event, scope it.\n3. **Containment** \u2014 short-term (isolate host) and long-term (block IPs, change creds).\n4. **Eradication** \u2014 remove malware, close the entry point.\n5. **Recovery** \u2014 restore systems, monitor for recurrence.\n6. **Lessons Learned (Post-incident)** \u2014 root-cause analysis, update playbooks.\n\n## Process supporting elements\n* **IR Policy** \u2014 high-level authority.\n* **IR Plan** \u2014 strategy and roles.\n* **IR Procedure / Runbooks** \u2014 step-by-step for specific incident types (ransomware, BEC, lost laptop).\n* **Communication plan** \u2014 internal, customers, regulators, law enforcement, media.\n\n## Exercises\n* **Tabletop** \u2014 \n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "5.1", "domain": 5, "title": "Governance & Security Policies", "estMinutes": 6, "body": "## Governance hierarchy\n* **Policies** \u2014 high-level \"what.\" Approved by leadership.\n* **Standards** \u2014 specific requirements (\"what version, what config\").\n* **Procedures** \u2014 step-by-step \"how.\"\n* **Guidelines** \u2014 recommendations, not mandatory.\n\n## Common policies\n* **Acceptable Use Policy (AUP)** \u2014 what employees can/can't do with company resources.\n* **Information Security Policy** \u2014 overarching security rules.\n* **Business Continuity Policy** \u2014 keep operating during disruption.\n* **Disaster Recovery Policy** \u2014 restore after disaster.\n* **Incident Response Policy** \u2014 authority to act, roles.\n* **Software Development Lifecycle (SDLC) Policy** \u2014 secure coding, code review, testing.\n* **Change Management Policy** \u2014 who approves what.\n* **Password Policy** \u2014 length, MFA, lockouts.\n* **Data c\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "5.2", "domain": 5, "title": "Risk Management", "estMinutes": 7, "body": "## Risk identification\nList threats \u00d7 vulnerabilities \u00d7 assets.\n\n## Risk assessment types\n* **Ad hoc** \u2014 one-off, often after an event.\n* **Recurring** \u2014 scheduled (quarterly, annual).\n* **One-time** \u2014 for a specific project.\n* **Continuous** \u2014 ongoing via tools (CSPM, vuln scanners).\n\n## Risk analysis\n* **Qualitative** \u2014 high/medium/low ratings; uses judgment. Quick.\n* **Quantitative** \u2014 calculate dollar impact.\n  - **AV (Asset Value)** \u2014 what the asset is worth.\n  - **EF (Exposure Factor)** \u2014 % of asset value lost per event.\n  - **SLE (Single Loss Expectancy)** = AV \u00d7 EF.\n  - **ARO (Annualized Rate of Occurrence)** \u2014 events/year.\n  - **ALE (Annualized Loss Expectancy)** = SLE \u00d7 ARO.\n  - **Compare ALE to control cost** \u2014 spend less than the loss.\n\n## Risk register\nA document tracking each\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "5.3", "domain": 5, "title": "Third-Party Risk & Agreements", "estMinutes": 6, "body": "## Why third-party risk matters\nYou inherit your vendors' security posture. Big breaches (Target HVAC vendor, SolarWinds, Kaseya) start in the supply chain.\n\n## Vendor selection\n* **Due diligence** \u2014 security questionnaires (SIG, CAIQ), reference checks.\n* **Conflict of interest** \u2014 disclose any.\n* **Right-to-audit clause** \u2014 contractually allow you to audit them.\n* **Evidence of internal audits**.\n* **Independent assessments** \u2014 SOC 2 Type II, ISO 27001, FedRAMP.\n* **Supply chain analysis** \u2014 their vendors are now your fourth parties.\n\n## Agreement types\n* **NDA (Non-Disclosure Agreement)** \u2014 protects confidential info.\n* **MOA (Memorandum of Agreement)** \u2014 formal but less than a contract.\n* **MOU (Memorandum of Understanding)** \u2014 informal intent.\n* **MSA (Master Service Agreement)** \u2014 um\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "5.4", "domain": 5, "title": "Compliance & Privacy", "estMinutes": 6, "body": "## Compliance reporting\n* **Internal reporting** \u2014 to leadership, board.\n* **External reporting** \u2014 to regulators, customers, public (breach notifications).\n\n## Consequences of non-compliance\n* **Fines** \u2014 GDPR up to 4% of global revenue.\n* **Sanctions** \u2014 loss of license to operate.\n* **Reputational damage** \u2014 customer trust loss.\n* **Loss of license** \u2014 for licensed industries.\n* **Contractual impacts** \u2014 breach of customer contracts.\n\n## Compliance monitoring\n* **Due diligence / care** \u2014 taking reasonable steps.\n* **Attestation and acknowledgment** \u2014 formal sign-off by responsible party.\n* **Internal vs. external monitoring** \u2014 both required.\n* **Automation** \u2014 continuous compliance checks (CSPM, GRC tools).\n\n## Privacy\n* **Legal implications** \u2014 varies by jurisdiction. **Local, regiona\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "5.5", "domain": 5, "title": "Audits & Assessments", "estMinutes": 6, "body": "## Attestation\nA formal statement by an authorized party that something is true (e.g., management attests to security controls).\n\n## Internal audits\n* **Compliance** \u2014 checks adherence to policies and regulations.\n* **Audit committee** \u2014 board-level oversight.\n* **Self-assessment** \u2014 periodic check by the team.\n\n## External audits\n* **Regulatory** \u2014 government bodies.\n* **Examinations** \u2014 formal reviews by regulators.\n* **Assessments by external firms** \u2014 SOC 2 (AICPA), ISO 27001 audits.\n* **Independent third-party audit** \u2014 provides credibility.\n\n## Penetration testing (governance lens)\n* **Physical** \u2014 buildings, badges, social engineering.\n* **Offensive (red team)** \u2014 simulate adversaries.\n* **Defensive (blue team)** \u2014 measure how detection/response performs.\n* **Integrated (purple team\n\n...\n\n*[Chapter continues - see full version in workspace]*"}, {"id": "5.6", "domain": 5, "title": "Security Awareness & Training", "estMinutes": 5, "body": "## Why awareness is a control\nMost successful attacks need a human to click, plug in, or share. Trained users dramatically reduce success rate.\n\n## Program elements\n* **Phishing simulation campaigns** \u2014 measure click rate, report rate; trend over time.\n* **Recognizing suspicious behavior** \u2014 anomalous messages, tailgaters, USB drops.\n* **Anomalous behavior recognition** \u2014 risky, unexpected, unintentional.\n* **Reporting and monitoring** \u2014 easy report-phish button; reward reporting.\n* **Initial training** \u2014 for new hires.\n* **Recurring training** \u2014 at least annual.\n* **Development and execution** \u2014 content, delivery, tracking.\n\n## User guidance & training topics\n* **Policy / handbook acknowledgment**.\n* **Situational awareness** \u2014 be wary of unsolicited contact.\n* **Insider threat** signs.\n*\n\n...\n\n*[Chapter continues - see full version in workspace]*"}];
const QUESTIONS = [{"id": "q001", "domain": 1, "q": "Which of the following BEST describes the difference between an IDS and an IPS?", "options": ["IDS encrypts traffic; IPS does not", "IDS is passive and alerts; IPS is inline and blocks", "IDS works at Layer 2; IPS at Layer 7", "There is no functional difference"], "answer": 1, "explain": "An IDS detects and alerts on suspicious activity (out-of-band/passive). An IPS sits inline and can actively block malicious traffic."}, {"id": "q002", "domain": 1, "q": "An organization wants to verify that downloaded software has not been altered. Which control provides this?", "options": ["Symmetric encryption", "Hashing", "Tokenization", "Steganography"], "answer": 1, "explain": "Hashing produces a fixed-length fingerprint of data. Comparing the published hash to one you compute confirms integrity."}, {"id": "q003", "domain": 1, "q": "Which control category does a security awareness program BEST fit into?", "options": ["Technical", "Physical", "Operational", "Compensating"], "answer": 2, "explain": "Awareness programs are operational controls \u2014 they are implemented by people, not systems."}, {"id": "q004", "domain": 1, "q": "A bollard at a building's entrance is BEST classified as which control type?", "options": ["Detective", "Preventive", "Corrective", "Directive"], "answer": 1, "explain": "A bollard physically prevents vehicles from accessing the area \u2014 it's a preventive (and physical) control."}, {"id": "q005", "domain": 1, "q": "Which of the following provides non-repudiation?", "options": ["AES encryption", "Symmetric MAC", "Digital signature", "Salt + hash"], "answer": 2, "explain": "A digital signature uses the sender's private key, so only that sender could have produced it \u2014 non-repudiation."}, {"id": "q006", "domain": 1, "q": "In Zero Trust architecture, which component makes the access decision?", "options": ["Policy Enforcement Point (PEP)", "Policy Engine", "Implicit trust zone", "Subject"], "answer": 1, "explain": "The Policy Engine evaluates conditions and produces a decision; the PEP enforces it."}, {"id": "q007", "domain": 1, "q": "An attacker captures an authentication packet and resends it later to gain access. Which mitigation is MOST effective?", "options": ["Longer passwords", "Nonces and timestamps", "Disabling SSH", "Stronger encryption keys"], "answer": 1, "explain": "Nonces and timestamps make each authentication unique, defeating replay attacks."}, {"id": "q008", "domain": 1, "q": "Which factor combination represents true MFA?", "options": ["Password and PIN", "Smart card and PIN", "Password and security question", "Two different passwords"], "answer": 1, "explain": "Smart card (something you have) + PIN (something you know) are different factors. Two passwords are both 'something you know.'"}, {"id": "q009", "domain": 1, "q": "Which protocol uses a Key Distribution Center (KDC) and is sensitive to clock skew?", "options": ["RADIUS", "Kerberos", "TACACS+", "LDAP"], "answer": 1, "explain": "Kerberos uses a KDC and time-bound tickets, requiring synchronized clocks (typically within 5 minutes)."}, {"id": "q010", "domain": 1, "q": "Which of the following BEST describes a honeyfile?", "options": ["A single decoy server", "A network of decoy systems", "A bait file that triggers an alert when accessed", "Encrypted backup of credentials"], "answer": 2, "explain": "A honeyfile looks attractive (e.g., 'passwords.xlsx') and alerts when anyone touches it."}, {"id": "q011", "domain": 1, "q": "An organization compares its current controls against the NIST CSF to identify weaknesses. This activity is BEST called:", "options": ["Gap analysis", "Risk transfer", "Penetration test", "Threat modeling"], "answer": 0, "explain": "Comparing current state to a desired state (a framework) is the definition of gap analysis."}, {"id": "q012", "domain": 1, "q": "Which is the MOST important reason to maintain a backout plan during change management?", "options": ["To document the change request", "To ensure a rapid revert if the change fails", "To get budget approval", "To meet auditor requirements"], "answer": 1, "explain": "A backout plan exists so the team can quickly restore service if the change has unintended impact."}, {"id": "q013", "domain": 1, "q": "Which type of encryption is fastest and best suited for bulk data?", "options": ["Asymmetric", "Symmetric", "Hashing", "Public-key"], "answer": 1, "explain": "Symmetric encryption uses one key and is much faster than asymmetric \u2014 used for bulk data, often with a key exchanged via asymmetric crypto."}, {"id": "q014", "domain": 1, "q": "What is the PRIMARY purpose of a salt in password hashing?", "options": ["Speed up hashing", "Defeat rainbow-table attacks", "Encrypt the password", "Replace the need for hashing"], "answer": 1, "explain": "A unique salt per password ensures the same password produces different hashes, defeating precomputed rainbow tables."}, {"id": "q015", "domain": 1, "q": "Which certificate type is BEST for a domain that needs to secure both example.com AND many subdomains like a.example.com?", "options": ["Self-signed", "Wildcard", "SAN with each subdomain listed", "Code-signing"], "answer": 1, "explain": "A wildcard certificate (*.example.com) covers all subdomains at one level under example.com."}, {"id": "q016", "domain": 1, "q": "Which mechanism allows a server to attach the OCSP response in the TLS handshake to improve performance?", "options": ["CRL", "OCSP stapling", "Pinning", "HSTS"], "answer": 1, "explain": "OCSP stapling lets the server fetch and 'staple' the OCSP response, eliminating the client lookup."}, {"id": "q017", "domain": 1, "q": "A device that securely stores and performs cryptographic operations on tamper-resistant hardware is called a:", "options": ["TPM", "HSM", "Secure enclave", "KMS"], "answer": 1, "explain": "An HSM is dedicated tamper-resistant hardware. A TPM is a similar concept but lives on a motherboard for a single host."}, {"id": "q018", "domain": 1, "q": "Tokenization is MOST commonly used to:", "options": ["Replace sensitive PCI data with a non-sensitive substitute", "Encrypt files at rest", "Hash passwords", "Detect malware"], "answer": 0, "explain": "Tokenization substitutes a non-sensitive token for sensitive data (e.g., credit card numbers), with the original stored in a vault."}, {"id": "q019", "domain": 1, "q": "Which is a key property that makes a blockchain tamper-evident?", "options": ["Centralized authority", "Each block contains the hash of the previous block", "Use of asymmetric encryption only", "Real-time replication"], "answer": 1, "explain": "Each block's hash incorporates the prior block's hash, so altering any block invalidates every later one."}, {"id": "q020", "domain": 1, "q": "Which cryptographic property makes finding two inputs with the same digest infeasible?", "options": ["Avalanche effect", "Collision resistance", "Determinism", "Reversibility"], "answer": 1, "explain": "Collision resistance \u2014 a strong hash should make it computationally infeasible to find two different inputs that hash to the same value."}, {"id": "q021", "domain": 1, "q": "Which of the following is an example of a directive control?", "options": ["Firewall rule", "Posted 'Authorized Personnel Only' sign", "Backup restoration", "Motion detector"], "answer": 1, "explain": "A directive control instructs subjects what to do; signage and policies are classic directive controls."}, {"id": "q022", "domain": 1, "q": "Which is BEST described as a compensating control?", "options": ["Replacing a vulnerable app with a patched one", "Using a host firewall to block exploitation while waiting on a vendor patch", "Posting an AUP", "Performing a vulnerability scan"], "answer": 1, "explain": "A compensating control mitigates risk when the primary control isn't available \u2014 like using a firewall rule until a patch is released."}, {"id": "q023", "domain": 1, "q": "An employee uses a fingerprint plus a hardware token to log in. This is an example of:", "options": ["Single-factor authentication", "Two-factor authentication", "SSO", "Federation"], "answer": 1, "explain": "Two factors from different categories (something you are + something you have) = MFA/2FA."}, {"id": "q024", "domain": 1, "q": "Which is the PRIMARY advantage of asymmetric encryption over symmetric?", "options": ["Faster performance", "No need to securely exchange a shared key", "Smaller key sizes for the same strength", "Resistance to quantum attacks"], "answer": 1, "explain": "Asymmetric crypto removes the need to pre-share a secret key; the public key can be shared openly."}, {"id": "q025", "domain": 1, "q": "Which is the RECOMMENDED minimum modern symmetric block cipher and key length?", "options": ["DES 56-bit", "3DES 112-bit", "AES 128-bit", "RC4 128-bit"], "answer": 2, "explain": "AES with 128-bit (or larger) keys is the current accepted standard."}, {"id": "q026", "domain": 1, "q": "Which control category does Group Policy fall under?", "options": ["Operational", "Physical", "Technical", "Managerial"], "answer": 2, "explain": "Group Policy is implemented by a system to enforce settings \u2014 a technical control."}, {"id": "q027", "domain": 1, "q": "What does the 'I' in CIA Triad ensure?", "options": ["Information is accessible", "Information has not been altered", "Information is private", "Information is auditable"], "answer": 1, "explain": "Integrity ensures data has not been changed (or alteration is detectable)."}, {"id": "q028", "domain": 1, "q": "Which authentication protocol encrypts only the password and uses UDP?", "options": ["TACACS+", "RADIUS", "Kerberos", "LDAPS"], "answer": 1, "explain": "RADIUS uses UDP and encrypts only the password field. TACACS+ uses TCP and encrypts the whole payload."}, {"id": "q101", "domain": 2, "q": "Which threat actor is BEST characterized as well-funded, patient, and motivated by espionage?", "options": ["Script kiddie", "Hacktivist", "Nation-state / APT", "Insider"], "answer": 2, "explain": "Nation-state actors / APTs have substantial funding, time horizons measured in years, and espionage or strategic disruption goals."}, {"id": "q102", "domain": 2, "q": "An attacker registers 'paypa1.com' to fool users. This is BEST called:", "options": ["Pharming", "Typosquatting", "Watering-hole attack", "Smishing"], "answer": 1, "explain": "Typosquatting registers a domain that's a misspelling of a real one to capture users who mistype."}, {"id": "q103", "domain": 2, "q": "An attacker compromises a popular industry forum to infect its visitors. This is a:", "options": ["Watering-hole attack", "Whaling attack", "Vishing attack", "Pharming attack"], "answer": 0, "explain": "Watering-hole attacks compromise sites a target group regularly visits, infecting them when they go."}, {"id": "q104", "domain": 2, "q": "Which attack involves writing past the end of a buffer to overwrite the return address?", "options": ["SQL injection", "Cross-site scripting", "Buffer overflow", "Race condition"], "answer": 2, "explain": "A classic buffer overflow overwrites adjacent memory, potentially the function's return address, redirecting execution."}, {"id": "q105", "domain": 2, "q": "Which is the BEST defense against SQL injection?", "options": ["WAF only", "Stored procedures only", "Parameterized queries / prepared statements", "Network segmentation"], "answer": 2, "explain": "Parameterized queries treat user input as data, never code, eliminating the root cause of injection."}, {"id": "q106", "domain": 2, "q": "Which type of XSS is stored on the server and served to subsequent visitors?", "options": ["Reflected", "Stored / persistent", "DOM-based", "Blind"], "answer": 1, "explain": "Stored XSS is persisted on the server (e.g., in a comment) and runs in every visitor's browser."}, {"id": "q107", "domain": 2, "q": "Which is a TOCTOU vulnerability?", "options": ["Buffer overflow", "Race condition where state changes between check and use", "SQL injection variant", "Memory leak"], "answer": 1, "explain": "Time-Of-Check / Time-Of-Use is a race condition where the state changes between when it was validated and when it was used."}, {"id": "q108", "domain": 2, "q": "Which malware self-propagates over a network without user interaction?", "options": ["Virus", "Worm", "Trojan", "Adware"], "answer": 1, "explain": "A worm is self-replicating and self-propagating; a virus needs a host file and user action."}, {"id": "q109", "domain": 2, "q": "Which malware typically uses PowerShell or WMI and lives only in memory?", "options": ["Boot sector virus", "Fileless malware", "Adware", "Bloatware"], "answer": 1, "explain": "Fileless malware leverages legitimate system tools (LOLBins) and resides in memory to evade signature-based AV."}, {"id": "q110", "domain": 2, "q": "An attacker gains access using a captured NTLM hash without ever knowing the cleartext password. This is:", "options": ["Credential stuffing", "Pass-the-hash", "Rainbow-table attack", "Brute force"], "answer": 1, "explain": "Pass-the-hash uses the hash as the credential \u2014 common in Windows lateral movement."}, {"id": "q111", "domain": 2, "q": "An attacker tries the same common password against many user accounts. This is:", "options": ["Brute force", "Dictionary", "Password spraying", "Credential stuffing"], "answer": 2, "explain": "Spraying tries a few common passwords against many accounts to avoid lockout thresholds."}, {"id": "q112", "domain": 2, "q": "Which is the MOST effective defense against rainbow-table attacks on stored passwords?", "options": ["Longer hashes", "Salting", "Symmetric encryption", "HMAC"], "answer": 1, "explain": "Salting ensures the same password hashes differently for each user, defeating precomputed lookup tables."}, {"id": "q113", "domain": 2, "q": "Which is the PRIMARY defense against ARP poisoning on a LAN?", "options": ["VLAN segmentation and Dynamic ARP Inspection", "Stronger Wi-Fi password", "HTTPS everywhere", "Port 22 firewall rules"], "answer": 0, "explain": "DAI (often combined with DHCP snooping) validates ARP packets against trusted bindings; VLAN segmentation limits scope."}, {"id": "q114", "domain": 2, "q": "An attacker stands up a Wi-Fi SSID identical to a corporate one to lure clients. This is:", "options": ["Bluejacking", "Evil twin", "SSL stripping", "Pharming"], "answer": 1, "explain": "Evil twin = a rogue AP impersonating a legitimate SSID to capture credentials and traffic."}, {"id": "q115", "domain": 2, "q": "Which DNS-based defense uses cryptographic signatures to validate responses?", "options": ["DNS over TLS", "DNSSEC", "DNS over HTTPS", "Split-horizon DNS"], "answer": 1, "explain": "DNSSEC adds digital signatures to DNS responses so resolvers can verify authenticity."}, {"id": "q116", "domain": 2, "q": "Which BEST describes a zero-day vulnerability?", "options": ["A vulnerability in a system older than ten years", "A vulnerability that has been patched but not deployed", "A vulnerability unknown to the vendor with no patch available", "A vulnerability that requires admin access"], "answer": 2, "explain": "Zero-days are unknown to the vendor; no patch yet exists, so defense relies on layered, behavior-based protections."}, {"id": "q117", "domain": 2, "q": "An attacker gets a privileged user to download a backdoored driver in a fake software update. This is BEST called:", "options": ["Watering-hole attack", "Supply-chain attack", "Phishing", "Replay attack"], "answer": 1, "explain": "Compromising the software update mechanism (or vendor) to deliver malware is a supply-chain attack (e.g., SolarWinds)."}, {"id": "q118", "domain": 2, "q": "Which is the FIRST priority when an organization detects active ransomware spreading on its network?", "options": ["Identify the variant", "Contain by isolating affected hosts", "Notify the press", "Pay the ransom"], "answer": 1, "explain": "Containment limits the blast radius. Identification and other steps follow once spread is stopped."}, {"id": "q119", "domain": 2, "q": "Which framework catalogs adversary tactics, techniques, and procedures by phase?", "options": ["MITRE ATT&CK", "NIST CSF", "COBIT", "ITIL"], "answer": 0, "explain": "MITRE ATT&CK organizes real-world TTPs across the kill chain and is widely used for detection engineering and threat hunting."}, {"id": "q120", "domain": 2, "q": "Which IoC pattern is BEST evidence of credential abuse via 'impossible travel'?", "options": ["Single login from a known IP", "Two successful logins from different continents within a few minutes", "High CPU on the user's workstation", "Multiple failed logins from one IP"], "answer": 1, "explain": "Successful logins from far-apart geographies in a short window indicate credential theft (impossible travel)."}, {"id": "q121", "domain": 2, "q": "Which mitigation BEST helps when a critical legacy app cannot be patched?", "options": ["Decommission immediately", "Network segmentation and compensating controls", "Apply the patch anyway", "Add to internet-facing DMZ"], "answer": 1, "explain": "Wrap unpatchable systems in compensating controls (segmentation, monitoring, restricted access)."}, {"id": "q122", "domain": 2, "q": "Which mitigation is MOST effective against phishing of user passwords?", "options": ["Stronger passwords only", "Email banners", "Phishing-resistant MFA (e.g., FIDO2)", "Daily password rotation"], "answer": 2, "explain": "FIDO2/WebAuthn keys are origin-bound and resist phishing even if the user is fooled."}, {"id": "q123", "domain": 2, "q": "Which is an example of a logic bomb?", "options": ["A worm spreading via SMB", "Code that deletes files on a specific date", "A keylogger sending keystrokes to an attacker", "A trojan disguised as a game"], "answer": 1, "explain": "A logic bomb triggers on a condition (date, event). It's often planted by insiders."}, {"id": "q124", "domain": 2, "q": "Which attack abuses a server to perform requests on behalf of an attacker, often hitting internal-only systems?", "options": ["XSS", "CSRF", "SSRF", "SQLi"], "answer": 2, "explain": "Server-Side Request Forgery (SSRF) tricks a server into making attacker-chosen requests, often pivoting to internal services."}, {"id": "q125", "domain": 2, "q": "Which best mitigates CSRF?", "options": ["Anti-CSRF tokens and SameSite cookies", "Account lockout", "File integrity monitoring", "Stronger TLS ciphers"], "answer": 0, "explain": "Anti-CSRF tokens validate that the request originated from the legitimate UI; SameSite cookies prevent cross-site send."}, {"id": "q126", "domain": 2, "q": "An attacker overwhelms a target with a flood of DNS responses caused by spoofed requests to open resolvers. This is:", "options": ["DNS poisoning", "DNS amplification DDoS", "DNS hijacking", "DNS tunneling"], "answer": 1, "explain": "Amplification DDoS leverages services that respond with much more data than the request, with spoofed source IPs."}, {"id": "q127", "domain": 2, "q": "Which BEST describes shadow IT?", "options": ["IT systems exposed to the internet", "Systems used by employees outside official IT sanction", "Backup systems in a cold site", "Honeypot infrastructure"], "answer": 1, "explain": "Shadow IT = unsanctioned tech (personal cloud, side accounts) that creates unmanaged risk."}, {"id": "q128", "domain": 2, "q": "Which is the BEST physical mitigation against tailgating into a data center?", "options": ["Door locks", "Access control vestibule (mantrap)", "Security cameras", "Lighting"], "answer": 1, "explain": "A mantrap admits only one person at a time, defeating tailgating directly."}, {"id": "q129", "domain": 2, "q": "Which technique prevents an attacker from reusing valid session cookies they've stolen?", "options": ["Setting cookie expiration far in the future", "Using HttpOnly, Secure, SameSite cookies and short session timeouts", "Using basic auth", "Disabling logging"], "answer": 1, "explain": "Hardened cookie attributes plus short timeouts limit theft and abuse windows."}, {"id": "q130", "domain": 2, "q": "An attacker sends spoofed emails appearing to be from the CFO, requesting an urgent wire transfer. This is:", "options": ["Spear phishing / BEC", "Whaling against the CFO", "Pharming", "Vishing"], "answer": 0, "explain": "Targeted email impersonating an executive to drive financial fraud is BEC (Business Email Compromise), often classed under spear phishing."}, {"id": "q201", "domain": 3, "q": "In an IaaS model, who is responsible for patching the guest operating system?", "options": ["The cloud provider", "The customer", "Shared", "Neither \u2014 it auto-patches"], "answer": 1, "explain": "In IaaS, the customer manages the OS, runtime, application, and data. The provider handles physical and hypervisor layers."}, {"id": "q202", "domain": 3, "q": "Which deployment model uses a mix of public and private cloud with orchestration?", "options": ["Multicloud", "Hybrid", "Community", "Edge"], "answer": 1, "explain": "Hybrid combines private + public with orchestration. Multicloud uses multiple public providers."}, {"id": "q203", "domain": 3, "q": "Which BEST describes microsegmentation?", "options": ["VLANs separating departments", "Per-workload network policy enforced by host firewalls or service mesh", "Splitting backups across regions", "Dedicated VLAN for guests"], "answer": 1, "explain": "Microsegmentation enforces fine-grained policy down to individual workloads, often with host firewalls or a service mesh."}, {"id": "q204", "domain": 3, "q": "Which network appliance sits inline and can drop malicious traffic in real time?", "options": ["IDS", "Honeypot", "IPS", "NetFlow collector"], "answer": 2, "explain": "An IPS is inline and actively blocks; an IDS is passive and only alerts."}, {"id": "q205", "domain": 3, "q": "Which is the strongest EAP method, requiring client-side certificates?", "options": ["EAP-TTLS", "PEAP", "EAP-FAST", "EAP-TLS"], "answer": 3, "explain": "EAP-TLS uses both server and client certificates, providing mutual authentication and the strongest assurance."}, {"id": "q206", "domain": 3, "q": "Which is the recommended Wi-Fi security standard for new deployments?", "options": ["WEP", "WPA", "WPA2-PSK", "WPA3"], "answer": 3, "explain": "WPA3 with SAE replaces the WPA2 4-way handshake and resists offline brute-force attacks."}, {"id": "q207", "domain": 3, "q": "Which TLS port is standard for HTTPS?", "options": ["443", "465", "8080", "993"], "answer": 0, "explain": "HTTPS uses TCP/443. 465 is SMTPS, 993 is IMAPS."}, {"id": "q208", "domain": 3, "q": "Which BEST describes a screened subnet (DMZ)?", "options": ["Encrypted backup zone", "Network segment that hosts public-facing services with restricted internal access", "Out-of-band management network", "An IPv6-only zone"], "answer": 1, "explain": "A DMZ hosts public-facing services and limits direct access to the internal trusted network."}, {"id": "q209", "domain": 3, "q": "An organization wants near-real-time data and the fastest RTO during a regional outage. Which DR site is BEST?", "options": ["Cold site", "Warm site", "Hot site", "Mobile site"], "answer": 2, "explain": "A hot site is fully running with synchronized data; lowest RTO/RPO at highest cost."}, {"id": "q210", "domain": 3, "q": "Which backup type takes only changes since the last full backup, requiring full + 1 differential to restore?", "options": ["Incremental", "Differential", "Snapshot", "Synthetic full"], "answer": 1, "explain": "Differential backups capture all changes since the last full backup. Restore = full + most recent differential."}, {"id": "q211", "domain": 3, "q": "Which BEST defends against ransomware destroying backups?", "options": ["Daily full backups", "Offline / air-gapped or immutable backups", "Encrypted backups", "Backups stored on the same SAN"], "answer": 1, "explain": "Offline/air-gapped or WORM/immutable backups can't be encrypted by ransomware reaching production storage."}, {"id": "q212", "domain": 3, "q": "Which RAID level provides striping with parity and tolerates a single disk failure?", "options": ["RAID 0", "RAID 1", "RAID 5", "RAID 10"], "answer": 2, "explain": "RAID 5 stripes data with distributed parity, surviving a single disk failure."}, {"id": "q213", "domain": 3, "q": "Which is the BEST way to keep data in transit confidential?", "options": ["Hashing", "TLS / IPsec", "FDE", "Tokenization"], "answer": 1, "explain": "TLS or IPsec encrypts data in motion; FDE protects data at rest."}, {"id": "q214", "domain": 3, "q": "Which describes data sovereignty?", "options": ["Encryption used by the government", "Data is governed by the laws of the jurisdiction it is stored in", "Data ownership transferred to a vendor", "Right to be forgotten"], "answer": 1, "explain": "Data sovereignty refers to data being subject to the laws of the country it resides in."}, {"id": "q215", "domain": 3, "q": "What does an HSM PRIMARILY provide?", "options": ["Antivirus signatures", "Tamper-resistant key storage and crypto operations", "Backup destination for VMs", "Patch management"], "answer": 1, "explain": "HSMs are dedicated tamper-resistant hardware for storing keys and performing crypto operations."}, {"id": "q216", "domain": 3, "q": "Which BEST defines a CASB?", "options": ["A type of firewall", "A broker enforcing security policies between users and cloud apps", "A specialized backup product", "A role-based authentication system"], "answer": 1, "explain": "CASBs sit between users and cloud apps, enforcing policy (visibility, compliance, threat protection, DLP)."}, {"id": "q217", "domain": 3, "q": "What is the PRIMARY benefit of SDN?", "options": ["Eliminates the need for switches", "Separates the control plane from the data plane for centralized policy", "Replaces firewalls", "Encrypts all packets"], "answer": 1, "explain": "SDN decouples decision-making from forwarding, enabling centralized, programmable policy."}, {"id": "q218", "domain": 3, "q": "Which port is associated with SSH (and SFTP)?", "options": ["22", "23", "53", "443"], "answer": 0, "explain": "SSH (and SFTP, which runs over SSH) use TCP/22."}, {"id": "q219", "domain": 3, "q": "Which BEST describes a forward proxy?", "options": ["Fronts internal services for external users", "Filters/caches user traffic going out to the internet", "Encrypts backups", "Distributes inbound load"], "answer": 1, "explain": "A forward proxy sits between internal users and the internet for filtering, caching, and policy."}, {"id": "q220", "domain": 3, "q": "An organization wants to ensure all servers can survive a single AZ failure with minimal downtime. Which BEST helps?", "options": ["Single hot spare", "Multi-AZ deployment with auto-failover", "Daily full backups", "Cold standby in another region"], "answer": 1, "explain": "Multi-AZ active/active or active/passive with auto-failover provides HA across availability zones."}, {"id": "q221", "domain": 3, "q": "Which BEST describes the difference between RTO and RPO?", "options": ["RTO is for hardware; RPO is for software", "RTO is downtime tolerated; RPO is data loss tolerated", "RTO is regulatory; RPO is contractual", "They are synonyms"], "answer": 1, "explain": "RTO = how long until restored. RPO = how much data loss is acceptable (drives backup frequency)."}, {"id": "q222", "domain": 3, "q": "Which IPsec mode encrypts the original IP header by encapsulating the entire packet?", "options": ["Transport", "Tunnel", "Aggressive", "Quick"], "answer": 1, "explain": "Tunnel mode encrypts the entire original packet, including the IP header, and adds a new outer IP header."}, {"id": "q223", "domain": 3, "q": "Which is a BEST practice for protecting cloud admin accounts?", "options": ["Reuse the same password across cloud and email", "Disable MFA for emergencies", "Enforce phishing-resistant MFA and least-privilege roles", "Share root credentials with the team"], "answer": 2, "explain": "Cloud admins should have phishing-resistant MFA, individual accounts, least privilege, and just-in-time elevation."}, {"id": "q224", "domain": 3, "q": "Which is the PRIMARY purpose of a jump server / bastion host?", "options": ["Caching web pages", "Centralized, monitored access path to internal systems", "DDoS protection", "Backup server"], "answer": 1, "explain": "A bastion host is a hardened pivot point used for administrative access, with strong logging."}, {"id": "q225", "domain": 3, "q": "Which device approach is BEST for limiting one MAC address per switch port?", "options": ["802.1X", "Port security", "NAC", "MAC filtering on the firewall"], "answer": 1, "explain": "Port security restricts the number/identity of MAC addresses allowed on a switch port."}, {"id": "q226", "domain": 3, "q": "Which configuration BEST supports protecting data in use?", "options": ["Disk encryption", "TLS for transit", "Confidential computing / secure enclaves", "RAID 5"], "answer": 2, "explain": "Confidential computing uses secure enclaves (SGX, TrustZone, AMD SEV) to keep data encrypted while being processed."}, {"id": "q301", "domain": 4, "q": "Which is the FIRST step in NIST's incident response lifecycle?", "options": ["Containment", "Preparation", "Eradication", "Recovery"], "answer": 1, "explain": "Preparation comes first: plan, tools, training, contacts. You can't respond well to what you haven't prepared for."}, {"id": "q302", "domain": 4, "q": "Which order of volatility lists items from MOST to LEAST volatile?", "options": ["Disk \u2192 RAM \u2192 CPU registers", "CPU registers \u2192 RAM \u2192 Disk \u2192 Backups", "Backups \u2192 RAM \u2192 Network state", "RAM \u2192 CPU registers \u2192 Disk"], "answer": 1, "explain": "From most to least volatile: CPU registers/cache \u2192 RAM \u2192 network/process state \u2192 disk \u2192 backups/archives."}, {"id": "q303", "domain": 4, "q": "Which document tracks who handled evidence, when, where, and why?", "options": ["Incident report", "Chain of custody", "RCA", "BIA"], "answer": 1, "explain": "Chain of custody is required for forensic evidence to be admissible and trustworthy."}, {"id": "q304", "domain": 4, "q": "Which BEST describes EDR vs. XDR?", "options": ["No difference", "EDR is for endpoints; XDR adds telemetry from network, email, cloud, and identity", "XDR is for endpoints only", "EDR replaces SIEM"], "answer": 1, "explain": "EDR focuses on endpoints; XDR correlates data across multiple security domains for broader detection."}, {"id": "q305", "domain": 4, "q": "Which BEST defines a security baseline?", "options": ["The cheapest possible configuration", "The documented, approved secure configuration that systems must match", "The minimum patch level", "The default vendor settings"], "answer": 1, "explain": "A baseline is the formally approved secure configuration; deviations are 'drift.'"}, {"id": "q306", "domain": 4, "q": "Which is the MOST appropriate tool to centrally collect and correlate security logs?", "options": ["WAF", "SIEM", "HIDS", "DLP"], "answer": 1, "explain": "A SIEM aggregates logs from many sources and applies correlation rules and analytics."}, {"id": "q307", "domain": 4, "q": "Which adds automation playbooks to security operations, e.g., auto-isolating hosts?", "options": ["SOAR", "SIEM", "NAC", "CASB"], "answer": 0, "explain": "SOAR (Security Orchestration, Automation, and Response) automates incident response actions."}, {"id": "q308", "domain": 4, "q": "Which is the BEST first step when a vulnerability scan reports a critical finding on an internet-facing host?", "options": ["Verify the finding (false-positive check) and prioritize remediation", "Reboot the server", "Notify the press", "Disable the scanner"], "answer": 0, "explain": "Validate to avoid wasted effort, then prioritize based on exposure, exploitability, and asset criticality."}, {"id": "q309", "domain": 4, "q": "Which testing approach analyzes source code without executing it?", "options": ["DAST", "SAST", "IAST", "Fuzzing"], "answer": 1, "explain": "Static Application Security Testing analyzes source/bytecode without execution to find vulns early."}, {"id": "q310", "domain": 4, "q": "Which testing simulates an external attacker with no internal information?", "options": ["White-box testing", "Gray-box testing", "Black-box testing", "Insider testing"], "answer": 2, "explain": "Black-box (unknown environment) testing simulates an external attacker with no insider knowledge."}, {"id": "q311", "domain": 4, "q": "Which scoring system rates vulnerabilities from 0.0 to 10.0?", "options": ["CVE", "CVSS", "CWE", "NIST CSF"], "answer": 1, "explain": "CVSS scores severity; CVE is the unique identifier for the vulnerability."}, {"id": "q312", "domain": 4, "q": "Which is the MOST appropriate response when remediation isn't feasible and risk has been accepted?", "options": ["Document a formal exception with owner and review date", "Ignore the finding", "Apply the patch anyway", "Disable scanning"], "answer": 0, "explain": "Risk acceptance must be documented with the owner, justification, compensating controls, and a review date."}, {"id": "q313", "domain": 4, "q": "Which BEST defines threat hunting?", "options": ["Reactive triage of SIEM alerts", "Proactive search for unknown compromise based on hypotheses", "Vendor-supplied threat intel feeds", "Annual penetration test"], "answer": 1, "explain": "Threat hunting proactively searches for adversaries that haven't tripped alerts, often guided by TTPs (MITRE ATT&CK)."}, {"id": "q314", "domain": 4, "q": "Which IAM control issues short-lived elevated privileges only when needed?", "options": ["RBAC", "Just-in-Time (JIT) access", "ABAC", "ACLs"], "answer": 1, "explain": "JIT access grants elevated rights for a short window then revokes them, reducing standing privilege."}, {"id": "q315", "domain": 4, "q": "Which method is MOST resistant to password phishing?", "options": ["TOTP from an authenticator app", "Push notification", "FIDO2 / passkey", "SMS code"], "answer": 2, "explain": "FIDO2/WebAuthn binds the credential to the legitimate site origin, defeating credential phishing."}, {"id": "q316", "domain": 4, "q": "Which is BEST for tracking software components in your apps for vulnerability management?", "options": ["WAF logs", "SBOM", "CRL", "DLP policy"], "answer": 1, "explain": "An SBOM (Software Bill of Materials) inventories components and versions used so you can map advisories to your apps."}, {"id": "q317", "domain": 4, "q": "Which BEST describes federation in IAM?", "options": ["A single sign-on portal within one company", "Trust relationship across separate identity domains", "Replacing all passwords with biometrics", "Only used in cloud"], "answer": 1, "explain": "Federation enables identities from one domain to access resources in another via standards like SAML/OIDC."}, {"id": "q318", "domain": 4, "q": "Which standard is XML-based and commonly used for SaaS SSO?", "options": ["OAuth 2.0", "OpenID Connect", "SAML 2.0", "Kerberos"], "answer": 2, "explain": "SAML 2.0 is XML-based and widely used for enterprise SaaS SSO."}, {"id": "q319", "domain": 4, "q": "Which password practice does modern guidance (NIST 800-63B) discourage?", "options": ["Length over complexity", "Blocking known-breached passwords", "Forced periodic expiration without cause", "Allowing long passphrases"], "answer": 2, "explain": "NIST recommends against routine forced expiration; rotate only on suspicion of compromise."}, {"id": "q320", "domain": 4, "q": "Which is the PRIMARY purpose of a CASB?", "options": ["Encrypt backups", "Enforce policy and provide visibility for cloud app usage", "Block all SaaS", "Replace MFA"], "answer": 1, "explain": "CASBs provide visibility, compliance, threat protection, and DLP for cloud applications."}, {"id": "q321", "domain": 4, "q": "Which is the strongest physical evidence handling step?", "options": ["Photograph everything", "Use a write-blocker to image storage", "Restart the system", "Delete everything quickly"], "answer": 1, "explain": "A w
